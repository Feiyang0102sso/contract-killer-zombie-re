[common]
Title=Contract Killer: Zombies

[graph]
Engine=m3g                              ; m3g: high FPS, may have bugs / swerve: original engine, slower
WindowWidth=2048                        ; Window width; shrunk to fit the desktop. Game renders at 1024x768
WindowHeight=1536                       ; Window height
FullScreen=0                            ; Fullscreen (0/1)
VSync=1                                 ; VSync (0/1). Off = uncapped FPS, use with care

[game]
DrawFPS=1                               ; Always draw the current FPS
KeyHints=1                              ; Show the bound key on the mission HUD controls (0/1)

[debug]
DebugMode=0                             ; Debug mode (0/1): console window + debug hotkeys below
FpsLog=0                                ; Print FPS, frame time, CPU time and live zombies every second (0/1), needs DebugMode=1

; Debug hotkeys (DebugMode=1):
;   F9               Dump the next frame to frame_N_1024x768.rgba next to the exe
;
; Cheat codes (type the letters once the game has loaded, no input box):
;   chxp             Level +1
;   chxxp            Level +10
;   chm              Cash and gold +9,999,999
